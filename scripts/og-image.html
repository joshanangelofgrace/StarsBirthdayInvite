<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Stars birthday invite — social preview source</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&display=swap"
    />
    <style>
      /* This file is the *source* for public/og-image.png, not something the
         site serves. `npm run og` screenshots it at exactly 1200x630 — the
         size Facebook, X, LinkedIn, WhatsApp and iMessage all crop cleanly.
         Values are duplicated from app/assets/css/main.css rather than
         imported because a headless screenshot cannot run Tailwind. */
      :root {
        --night-950: #090a0f;
        --night-900: #1b2735;
        --night-700: #38495a;
        --gold: gold;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }

      body {
        position: relative;
        isolation: isolate;
        background: radial-gradient(
          ellipse at bottom,
          var(--night-900) 0%,
          var(--night-950) 100%
        );
        font-family:
          "Lato", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        color: #fff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
      }

      /* Same trick as StarField.vue: one 1px element casting hundreds of
         box-shadows, seeded so the layout is identical on every run. */
      .stars {
        position: absolute;
        top: 0;
        left: 0;
        background: transparent;
      }

      .invited {
        font-size: 44px;
        font-weight: 300;
        line-height: 1.6;
        letter-spacing: 0.3em;
        /* Indent compensates for the trailing letter-space, which would
           otherwise push each centred line left by half a space. */
        text-indent: 0.3em;
      }

      /* Per line, not per heading: the gradient runs top-to-bottom, so one
         gradient spanning both lines would leave line two entirely in the dark
         end. app/pages/index.vue splits it the same way. */
      .invited span {
        display: block;
        background: linear-gradient(to bottom, #fff 25%, var(--night-700) 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      .names {
        margin-top: 44px;
        font-size: 20px;
        font-weight: 300;
        letter-spacing: 0.25em;
        text-indent: 0.25em;
        line-height: 2;
        color: rgb(255 255 255 / 0.9);
      }

      .date {
        margin-top: 56px;
        font-size: 24px;
        font-weight: 400;
        letter-spacing: 0.15em;
        text-indent: 0.15em;
        color: var(--gold);
      }

      .place {
        margin-top: 14px;
        font-size: 16px;
        font-weight: 300;
        letter-spacing: 0.15em;
        text-indent: 0.15em;
        color: var(--gold);
      }

      /* A single shooting star, frozen mid-flight — the animated version reads
         as nothing at all in a still image. */
      .shoot {
        position: absolute;
        top: 108px;
        left: 132px;
        width: 3px;
        height: 3px;
        border-radius: 999px;
        background: #fff;
        box-shadow: 0 0 6px 2px rgb(255 255 255 / 0.35);
        transform: rotate(18deg);
      }

      .shoot::after {
        content: "";
        position: absolute;
        top: 1px;
        right: 3px;
        width: 150px;
        height: 1px;
        background: linear-gradient(to left, rgb(255 255 255 / 0.7), transparent);
      }
    </style>
  </head>
  <body>
    <div class="shoot"></div>

    <h1 class="invited">
      <span>YOU ARE INVITED</span>
      <span>TO A PARTY UNDER THE STARS</span>
    </h1>

    <p class="names">A SHARED BIRTHDAY CELEBRATION OF LIEKE &amp; JOSHUA</p>
    <p class="date">18TH OCTOBER 2026</p>
    <p class="place">JAN WOLKERSLAAN 47, OEGSTGEEST</p>

    <script>
      // mulberry32, copied from StarField.vue so the preview and the live site
      // share the same star distribution.
      function mulberry32(seed) {
        let a = seed;
        return () => {
          a |= 0;
          a = (a + 0x6d2b79f5) | 0;
          let t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      // Counts are scaled down from the live layers: the site tiles 2000px of
      // stars and scrolls them, this is a single 630px frame.
      for (const [count, size, seed] of [
        [260, 1, 1],
        [70, 2, 2],
        [34, 3, 3],
      ]) {
        const random = mulberry32(seed);
        const shadows = [];
        for (let i = 0; i < count; i++) {
          const x = (random() * 1200).toFixed(1);
          const y = (random() * 630).toFixed(1);
          shadows.push(x + "px " + y + "px #fff");
        }
        const layer = document.createElement("div");
        layer.className = "stars";
        layer.style.width = size + "px";
        layer.style.height = size + "px";
        layer.style.boxShadow = shadows.join(", ");
        document.body.prepend(layer);
      }
    </script>
  </body>
</html>
