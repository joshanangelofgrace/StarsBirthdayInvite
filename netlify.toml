# Without this file Netlify auto-detects Nuxt and guesses the publish directory,
# which is how /rsvp ended up as a "Page not found". Be explicit instead.
#
# `publish` points at the real output directory rather than the `dist` symlink
# Nitro drops in the project root, so the deploy does not depend on symlink
# resolution. NITRO_PRESET pins the static preset, otherwise Nitro sees
# Netlify's env vars and auto-switches to its serverless preset.
[build]
  command = "npm run build"
  publish = ".output/public"

[build.environment]
  NITRO_PRESET = "static"

# The party is over: send every page visit to the gallery. `force` is needed
# because these pages still exist as prerendered files, and Netlify otherwise
# serves a real file ahead of a redirect. 302 (not 301) so browsers don't cache
# it forever — delete these rules to bring the invite pages back. Assets
# (/_nuxt, /_ipx, /gallery/*, images) are untouched.
[[redirects]]
  from = "/"
  to = "/gallery"
  status = 302
  force = true

[[redirects]]
  from = "/index.html"
  to = "/gallery"
  status = 302
  force = true

[[redirects]]
  from = "/rsvp"
  to = "/gallery"
  status = 302
  force = true

[[redirects]]
  from = "/thank-you"
  to = "/gallery"
  status = 302
  force = true
